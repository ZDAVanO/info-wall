<html lang="en">

    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>info-wall</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

      content="black-translucent"

  <body>
    <div
      id="sleepMode"
      class="sleep-mode"
      onclick="Dashboard.dismissSleepMode()"
    >
      <div class="sleep-clock">
        <span id="sleepHours">00</span>
        <span class="clock-sep">:</span>
        <span id="sleepMinutes">00</span>
      </div>
    </div>

    <div class="dashboard-wrapper">
      <div class="status-container">
        <div
          id="warmButton"
          class="warm-button"
          onclick="Dashboard.toggleWarmMode()"
        >
          💡
        </div>
        <div
          id="sleepButton"
          class="sleep-button"
          onclick="Dashboard.enterSleepMode()"
        >
          🌙
        </div>
        <div id="batteryContainer" class="battery-container">
          <span id="batteryIcon"></span>
          <span id="batteryLevel">--%</span>
        </div>
      </div>

      <div class="dashboard">
        <div class="top-section">
          <div id="clock" class="clock" onclick="Dashboard.toggleFullscreen()">
            <span id="hours">00</span>
            <span class="clock-sep">:</span>
            <span id="minutes">00</span>
          </div>

          <div class="date-section">
            <span id="monthName" class="month-name">Month</span>
            <div id="numeric-date">00.00</div>
          </div>
        </div>

        <div class="widget-section">
          <div id="offlineMessage" class="offline-message">
            <div class="offline-icon">📡</div>
            <span>no connection</span>
          </div>
