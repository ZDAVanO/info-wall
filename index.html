<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>info-wall</title>
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" href="images/icon-192x192.png" sizes="96x96" type="image/png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Outfit:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div
      id="sleepMode"
      class="sleep-mode"
      onclick="Dashboard.dismissSleepMode()"
    >
      <div class="sleep-clock">
        <span id="sleepHours">00</span>
        <span class="clock-sep">:</span>
        <span id="sleepMinutes">00</span>
      </div>
    </div>

    <div class="status-container">
      <div
        id="warmButton"
        class="warm-button"
        onclick="Dashboard.toggleWarmMode()"
      >
        💡
      </div>
      <div
        id="sleepButton"
        class="sleep-button"
        onclick="Dashboard.enterSleepMode()"
      >
        🌙
      </div>
      <div id="batteryContainer" class="battery-container">
        <span id="batteryIcon"></span>
        <span id="batteryLevel">--%</span>
      </div>
    </div>

    <div class="dashboard">
      <div class="top-section">
        <div id="clock" class="clock" onclick="Dashboard.toggleFullscreen()">
          <span id="hours">00</span>
          <span class="clock-sep">:</span>
          <span id="minutes">00</span>
        </div>

        <div class="date-section">
          <span id="monthName" class="month-name">Month</span>
          <div id="numeric-date">00.00</div>
        </div>
      </div>

      <div class="widget-section">
        <div id="offlineMessage" class="offline-message">
          <div class="offline-icon">📡</div>
          <span>no connection</span>
        </div>

        <div id="mapWrapper" class="map-frame-wrapper">
          <div id="widgetHeader" class="widget-header">MAP</div>
          <iframe
            id="mapIframe"
            scrolling="no"
          ></iframe>
        </div>
      </div>

      <div class="extra-section">
        <div id="weather" class="weather-container">
          <div id="weatherCity" class="weather-city">Novoiavorivsk</div>
          <div id="weatherIcon" class="weather-icon">--</div>
          <div id="weatherTemp" class="weather-temp">--°</div>
          <div id="weatherDesc" class="weather-desc">-----</div>
          <div class="weather-range">
            <span id="weatherMax" class="temp-max">--°</span>
            <span id="weatherMin" class="temp-min">--°</span>
          </div>
        </div>
      </div>

      <div class="calendar-section">
        <div class="calendar">
          <div id="calendarGrid" class="calendar-grid"></div>
        </div>
      </div>
    </div>

    <div class="version-label">v1.2</div>
    <script src="script.js" defer></script>
  </body>
</html>
